name: Lint ROS2 package

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - "*humble*"
      - "*jazzy*"
      - "*lyrical*"
      - "*rolling*"
  push:
    branches:
      - "*humble*"
      - "*jazzy*"
      - "*lyrical*"
      - "*rolling*"

env:
  PACKAGE_NAME: "adi_iio"

permissions:
  contents: read
  checks: write

jobs:
  ament_lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distribution:
          - lyrical
        linter:
          - cppcheck
          - uncrustify
          - pep257
          - lint_cmake
          - xmllint
        include:
          # Lyrical Luth (May 2026 - May 2031)
          - docker_image: ubuntu:resolute
            ros_distribution: lyrical
            ros_version: 2

    container:
      image: ${{ matrix.docker_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup ROS environment
        uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab # v0.7.19
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}
          use-ros2-testing: false

      - name: Run Linter
        env:
          AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: 1
        uses: ros-tooling/action-ros-lint@master
        with:
          linter: ${{ matrix.linter }}
          distribution: ${{ matrix.ros_distribution }}
          package-name: ${{ env.PACKAGE_NAME }}

  pre_commit:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        ros_distribution:
          - lyrical

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pip packages
        working-directory: ${{ github.workspace }}
        run: |
          pip install pip --upgrade
          pip install -r requirements.txt

      - name: Setup ROS environment
        uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab # v0.7.19
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}
          use-ros2-testing: false

      - name: Run pre-commit-checks
        working-directory: ${{ github.workspace }}
        run: |
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          make fix
          FIX_STATUS=$?

          make check
          CHECK_STATUS=$?

          if [ $FIX_STATUS -ne 0 ] || [ $CHECK_STATUS -ne 0 ]; then
            echo "Pre-commit checks failed. Please fix the issues and try again."
            exit 1
          fi
